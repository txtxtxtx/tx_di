# ══════════════════════════════════════════════════════════════════════════════
# tx_di 全量配置文件
# ══════════════════════════════════════════════════════════════════════════════
# 本文件包含所有插件的完整配置项、默认值和详细注释。
# 使用时删除不需要的 section，或保留默认值即可运行。
# ══════════════════════════════════════════════════════════════════════════════


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 1. tx_di_log — 日志插件
# ║ TOML key: [log]     init_sort: i32::MIN（最早初始化）
# ╚══════════════════════════════════════════════════════════════════════════════
[log]
# 全局日志级别。可选: trace / debug / info / warn / error
# 默认: "info"
level = "info"

# 模块级别日志覆盖。格式: "crate::module" = "level"
# 默认: 空（不覆盖）
# [log.modules]
# "tx_di_gb28181" = "debug"
# "tx_di_sip" = "trace"

# 日志格式字符串，空字符串使用默认格式
# 默认: ""（tracing-subscriber 默认格式）
format = ""

# 日志文件输出目录
# 默认: 可执行文件所在目录的 logs/ 子目录，取不到则 "./logs"
dir = "./logs"

# 日志文件保留天数
# 默认: 90
retention_days = 90

# 是否输出到控制台
# 默认: true
console_output = true

# 日志文件前缀
# 默认: "tx_di"
prefix = "tx_di"

# 时间格式类型。可选: local / utc
# 默认: "local"
time_format = "local"

# 自定义时间戳格式字符串
# 默认: "[hour]:[minute]:[second].[subsecond digits:3]"
time_format_str = "[hour]:[minute]:[second].[subsecond digits:3]"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 2. tx_di_cache — 缓存插件
# ║ TOML key: [cache_config]     init_sort: i32::MIN + 1
# ╚══════════════════════════════════════════════════════════════════════════════
[cache_config]
# 默认 TTL（秒）。0 表示永不过期
# 默认: 3600（1 小时）
default_ttl_secs = 3600

# 键前缀。用于隔离不同应用的缓存键
# 默认: ""
key_prefix = ""

# 内存缓存最大条目数。0 表示无限制
# 默认: 10000
memory_max_capacity = 10000

# Redis 连接 URL（可选，配置后启用 Redis 后端）
# 格式: redis://[user:pass@]host:port[/db]  或  rediss://...（TLS）
# 默认: null（不启用 Redis）
# redis_url = "redis://127.0.0.1:6379"

# Redis 连接池大小
# 默认: 10
redis_pool_size = 10

# Redis 连接超时（秒）
# 默认: 5
redis_timeout_secs = 5


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 3. tx_di_toasty — ORM 数据库插件
# ║ TOML key: [toasty]     init_sort: i32::MIN + 2
# ║ 依赖: tx_di_log
# ╚══════════════════════════════════════════════════════════════════════════════
[toasty]
# 数据库连接字符串。scheme 决定驱动（需启用对应 feature）：
#   sqlite://path/to/db.db          SQLite（无需额外依赖）
#   sqlite://memory                 内存数据库（测试用）
#   postgresql://user:pass@host/db  PostgreSQL（feature = "postgresql"）
#   mysql://user:pass@host/db       MySQL（feature = "mysql"）
#   dynamodb://endpoint/region/...  DynamoDB（feature = "dynamodb"）
# 默认: "sqlite://gb28181.db"
database_url = "sqlite://gb28181.db"

# 启动时自动创建/更新数据表
#   true  — 开发环境推荐
#   false — 生产环境推荐（手动管理迁移）
# 默认: true
auto_schema = true

# 连接池最大连接数。不填则取 num_cpus * 2
# 默认: null（自动）
# max_pool_size = 10

# 表名前缀。如 "app_" → 所有表名加 "app_" 前缀
# 默认: null（无前缀）
# table_name_prefix = "app_"

# 从连接池获取空闲连接的最大等待时间（秒）
# 默认: null（无限等待）
# pool_wait_timeout_secs = 30

# 建立新连接的最大允许时间（秒）
# 默认: null
# pool_create_timeout_secs = 10

# 连接池后台健康检查间隔（秒）。0 表示禁用
# 默认: null
# pool_health_check_interval_secs = 60

# 连接最大存活时间（秒）。负载均衡器场景推荐 1800（30分钟）
# 默认: null
# pool_max_connection_lifetime_secs = 1800

# 连接最大空闲时间（秒）。超时连接将被驱逐
# 默认: null
# pool_max_connection_idle_time_secs = 300

# 每次取出连接前是否先 ping。高可用场景推荐开启
# 默认: false
pool_pre_ping = false

# 数据库为空时自动创建的 admin 账号默认密码
# 默认: "admin123"
default_admin_password = "admin123"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 4. tx_di_file — 统一文件存储插件
# ║ TOML key: [file]     init_sort: i32::MIN + 3
# ╚══════════════════════════════════════════════════════════════════════════════
[file]
# 本地存储根路径
# 默认: "./uploads"
base_path = "./uploads"

# 文件访问基础 URL（用于生成下载链接）
# 默认: ""
base_url = "http://localhost:8080/files"

# 单个文件最大大小（字节）。0 表示不限制
# 默认: 0（不限制）
max_file_size = 10485760    # 10MB

# 允许的文件扩展名（小写）。空列表表示不限制
# 默认: []
allowed_extensions = ["jpg", "png", "pdf", "docx"]

# ── 额外存储后端（可多个） ─────────────────────────────────────────────
# [[file.extra_storages]]
# name = "s3-main"                # 后端名称（映射为 sys:<name> 或 user:<name>）
# backend = "s3"                  # local / s3 / database
# base_path = ""                  # 本地路径（backend="local" 时生效）
# base_url = ""                   # 访问 URL
# [file.extra_storages.s3]
# bucket = "my-bucket"            # S3 bucket 名称
# region = "ap-southeast-1"       # AWS 区域
# endpoint = "http://localhost:9000"  # S3 兼容端点（MinIO 等）
# access_key = ""                 # Access Key
# secret_key = ""                 # Secret Key
# force_path_style = true         # 强制路径风格（MinIO 需 true）


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 5. tx_di_axum — Web 服务器插件
# ║ TOML key: [web_config]     init_sort: i32::MAX（最后启动）
# ║ 依赖: tx_di_log
# ╚══════════════════════════════════════════════════════════════════════════════
[web_config]
# 监听地址。IPv4: "127.0.0.1"、"0.0.0.0"  IPv6: "::1"、"::"
# 默认: "127.0.0.1"
host = "127.0.0.1"

# 监听端口
# 默认: 8080
port = 8080

# 是否启用 CORS（跨域资源共享）
# 默认: false
enable_cors = true

# 最大请求体大小（字节）
# 默认: 10485760（10MB）
max_body_size = 10485760

# 静态文件托管目录
# 默认: "./static"
static_dir = "./static"

# SPA 应用映射（可选）。格式: { 路由前缀 = 静态目录 }
# 所有 /admin 下的请求 fallback 到 admin-spa/index.html
# [web_config.spa_apps]
# "/admin" = "./admin-spa"
# "/portal" = "./portal-spa"

# 请求超时时间（秒）
# 默认: 30
timeout_secs = 30

# 中间件注册列表。格式: [(priority, "layer_name"), ...]
# 可用中间件名见 tx_di_axum README
# [web_config.layers]
# layers = [[100, "cors"], [200, "compression"]]

# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 6. tx_di_sa_token — 认证鉴权插件
# ║ TOML key: [sa_token]     init_sort: i32::MIN + 1
# ║ 依赖: tx_di_axum
# ║ feature: memory（默认）/ redis / database（存储后端）
# ╚══════════════════════════════════════════════════════════════════════════════
[sa_token]
# Token 读取键名（Header / Parameter / Cookie 中查找的键）
# 默认: "Authorization"
token_name = "Authorization"

# Token 有效期（秒），-1 表示永不过期
# 默认: 86400（24 小时）
timeout = 86400

# Token 最低活跃频率（秒），-1 表示不限制。配合 auto_renew 使用
# 默认: -1（不限制）
active_timeout = -1

# 是否开启自动续签。true 时，active_timeout 作为自动续签时长
# 默认: false
auto_renew = false

# 是否允许同一账号并发登录
# 默认: true
is_concurrent = true

# 多人登录同一账号时是否共享一个 Token
# 默认: true
is_share = true

# Token 风格。可选:
#   uuid / simple-uuid / random-32 / random-64 / random-128
#   jwt / hash / tik / timestamp
# 默认: "uuid"
token_style = "uuid"

# 是否从请求体读取 Token
# 默认: false
is_read_body = false

# 是否从 Header 读取 Token
# 默认: true
is_read_header = true

# 是否从 Cookie 读取 Token
# 默认: true
is_read_cookie = true

# 是否输出操作日志
# 默认: false
is_log = false

# JWT 密钥（token_style = "jwt" 时使用）
# 默认: null
# jwt_secret_key = "your-secret-key"

# JWT 算法（token_style = "jwt" 时使用）
# 默认: null（HS256）
# jwt_algorithm = "HS256"

# 是否启用防重放攻击（nonce 机制）
# 默认: false
enable_nonce = false

# Nonce 有效期（秒），-1 表示使用 token timeout
# 默认: -1
nonce_timeout = -1

# 是否启用 Refresh Token
# 默认: false
enable_refresh_token = false

# Refresh Token 有效期（秒）
# 默认: 604800（7 天）
refresh_token_timeout = 604800


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 7. tx_di_job — 定时任务插件
# ║ TOML key: [job]     init_sort: i32::MIN + 1
# ║ 依赖: tx_di_toasty（持久化任务状态到数据库）
# ╚══════════════════════════════════════════════════════════════════════════════
[job]
# 是否启用调度器
# 默认: true
enabled = true

# 调度器轮询间隔（秒）
# 默认: 1
poll_interval_secs = 1

# Shell 脚本执行超时（秒）
# 默认: 300（5 分钟）
shell_timeout_secs = 300

# Python 脚本执行超时（秒）
# 默认: 300（5 分钟）
python_timeout_secs = 300

# Python 解释器路径
# 默认: "/usr/bin/python3"
python_path = "/usr/bin/python3"

# 任务执行线程池大小
# 默认: 4
thread_pool_size = 4

# 内部函数执行器超时（秒）
# 默认: 300（5 分钟）
internal_timeout_secs = 300


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 8. tx_di_nacos — 配置中心 + 服务注册 + 应用启动循环（非组件 crate）
# ║ TOML key: [registry_config]     由 tx_di_nacos::app_loop! 读取（bootstrap）
# ╚══════════════════════════════════════════════════════════════════════════════
[registry_config]
# 主开关：是否启用注册中心
# 默认: false
enabled = false

# Nacos 服务地址
# 默认: "http://127.0.0.1:8848"
nacos_addr = "http://127.0.0.1:8848"

# 命名空间
# 默认: "public"
namespace = "public"

# 分组
# 默认: "DEFAULT_GROUP"
group = "DEFAULT_GROUP"

# 本地服务名（注册到 Nacos 的 service name）
# 默认: "unknown-service"
service_name = "my-service"

# 是否自动注册本地端点
# 默认: true
auto_register = true

# 心跳间隔（秒）
# 默认: 5
heartbeat_secs = 5

# 主配置 data_id（整份 TOML，远程覆盖本地；启动时拉取 + 变更时优雅重启生效）
# 默认: null（使用 "{service_name}.toml"）
# config_data_id = "tx-admin.toml"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 9. tx_di_sip — SIP 协议栈插件（服务端）
# ║ TOML key: [sip_config]     init_sort: 10000
# ╚══════════════════════════════════════════════════════════════════════════════
[sip_config]
# 监听地址。IPv4: "0.0.0.0"（所有接口）、IPv6: "::"（双栈）
# 默认: "0.0.0.0"
host = "0.0.0.0"

# SIP 监听端口
# 默认: 5060
port = 5060

# 传输层协议。可选: udp / tcp / both / tls / ws
# 默认: "both"（国标推荐，兼容老设备 UDP、NAT 友好 TCP）
transport = "both"

# User-Agent 字符串
# 默认: "tx-di-sip/1.0.0"
user_agent = "tx-di-sip/1.0.0"

# 对外可见公网 IP（NAT 穿透，用于 Contact/Via 头）
# 不填则使用 host 字段的值
# 默认: null
# external_ip = "203.0.113.1"

# 是否开启详细 SIP 消息日志
# 默认: false
log_messages = false

# SIP 认证域（realm）。不填则接受任意域的挑战
# 默认: null
# realm = "3402000000"

# REGISTER/INVITE 等请求的超时重试次数
# 默认: 1
retry_count = 1

# SIP 请求超时时间（秒）
# 默认: 30
request_timeout_secs = 30

# 是否启用 SIP 服务。水平扩容时可设为 false 仅做客户端
# 默认: true
enabled = true

# 分发队列容量（生产者→消费者 channel）
# 默认: 10000
dispatch_queue_size = 10000

# 并发 handler 上限（Semaphore 背压）
# 默认: 1000
max_concurrent_handlers = 1000

# ── TLS 配置（transport = "tls" 时生效） ────────────────────────────────
# [sip_config.tls]
# cert_pem = "/path/to/server-cert.pem"
# key_pem = "/path/to/server-key.pem"
# ca_certs = "/path/to/ca.pem"          # 可选，启用双向 TLS (mTLS)
# client_cert = "/path/to/client-cert.pem"  # 可选，作为客户端时使用
# client_key = "/path/to/client-key.pem"

# ── SIP 客户端注册配置 ──────────────────────────────────────────────────
[sip_client]
# 注册服务器地址。格式: "192.168.1.1:5060" 或 "sip:192.168.1.1:5060"
# 默认: ""
registrar = "sip:192.168.1.1:5060"

# 注册用户名（通常为平台/设备 ID）
# 默认: ""
username = "34020000001320000001"

# 注册密码
# 默认: ""
password = "12345678"

# 认证域（realm），null 表示接受任意挑战
# 默认: null
# realm = "3402000000"

# 注册有效期（秒）
# 默认: 3600
expires = 3600

# 续期间隔（秒）。0 表示自动取 expires/2（至少 30 秒）
# 默认: 0
renew_secs = 0

# 是否启用客户端注册
# 默认: false
enabled = false


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 10. tx_di_gb28181 — GB28181 上级平台服务端
# ║ TOML key: [gb28181_server_config]     init_sort: 10001
# ║ 依赖: tx_di_sip
# ╚══════════════════════════════════════════════════════════════════════════════
[gb28181_server_config]
# 本平台 ID（20 位编号，GB28181 规范）
# 默认: "34020000002000000001"
platform_id = "34020000002000000001"

# 认证域（realm），用于 SIP 摘要认证
# 默认: "3402000000"
realm = "3402000000"

# 平台 SIP 服务对外暴露的 IP（用于构造 SIP URI）
# 默认: "127.0.0.1"
sip_ip = "127.0.0.1"

# 设备心跳超时时间（秒）。超时未收到心跳则视为离线
# 默认: 120
heartbeat_timeout_secs = 120

# 设备注册有效期上限（秒），回写到 200 OK 的 Contact Expires
# 默认: 3600
register_ttl = 3600

# 是否开启摘要认证（生产环境建议开启）
# 默认: false
enable_auth = false

# 全局认证密码（所有设备共用）
# 默认: "12345678"
auth_password = "12345678"

# 按设备 ID 配置独立密码（优先级高于 auth_password）
# [gb28181_server_config.device_passwords]
# "34020000001320000001" = "device1_pass"
# "34020000001320000002" = "device2_pass"

# ── 设备访问控制 ─────────────────────────────────────────────────────────
# 设备注册白名单（device_id 列表）。非空时仅白名单中的设备允许注册
# 默认: []（不启用白名单，允许所有设备）
# allowed_device_ids = ["34020000001320000001", "34020000001320000002"]

# 设备注册黑名单（device_id 列表）。黑名单中的设备始终被拒绝，优先级高于白名单
# 默认: []
# blocked_device_ids = ["34020000001990000099"]

# ── 协议版本 ──────────────────────────────────────────────────────────────
# 默认协议版本（新注册设备未在下表命中时使用）
# 可选: v2016 / v2022
# 默认: v2022
default_version = "v2022"

# 按设备 ID 覆盖协议版本（混合组网：部分 2016 老设备 + 2022 新设备）
# [gb28181_server_config.device_versions]
# "34020000001320000001" = "v2016"

# ── 媒体层配置 ───────────────────────────────────────────────────────────
[gb28181_server_config.media]
# 媒体服务器本机 IP（用于 SDP c= 行，0.0.0.0 表示自动探测）
# 默认: "0.0.0.0"
local_ip = "0.0.0.0"

# RTP 端口起始值（动态分配时从此端口开始，0 表示由流媒体服务器自动分配）
# 默认: 30000
rtp_port_start = 30000

# RTP 端口结束值
# 默认: 30500
rtp_port_end = 30500

# NAT 穿透时对外暴露的公网 IP（用于 SDP c= 行）
# 不填则使用 local_ip / sip_ip
# 默认: null
# nat_external_ip = "203.0.113.1"

# ── 流媒体后端（新版统一配置） ──────────────────────────────────────────
[gb28181_server_config.media_backend]
# 后端类型。可选: zlm（ZLM）、mediamtx（MediaMTX）、null（禁用）
# 默认: null（不启用）
backend_type = "zlm"

# ── ZLM (ZLMediaKit) 配置 ────────────────────────────────────────────────
[gb28181_server_config.media_backend.zlm]
# ZLM API 基础 URL
# 默认: ""
base_url = "http://127.0.0.1:8080"

# ZLM API 密钥（secret）
# 默认: ""
secret = ""

# API 请求超时（秒）
# 默认: 10
timeout_secs = 10

# RTSP 服务端口（对设备直播推流的推送目标）。0 表示禁用
# 默认: 554
rtsp_port = 554

# RTSP over TLS 端口（加密推流）。0 表示禁用
# 默认: 0
rtsps_port = 0

# RTMP 服务端口（推流目标，部分设备使用）。0 表示禁用
# 默认: 1935
rtmp_port = 1935

# HTTP 服务端口（拉流 / HLS / FLV）
# 默认: 8080
http_port = 8080

# HTTPS 服务端口
# 默认: 8081
https_port = 8081

# ── 级联配置（上下级平台互联） ──────────────────────────────────────────
[gb28181_server_config.cascade]
# 本平台是否作为上级（接收下级设备/平台注册）
# 默认: true
enable_upper = true

# 本平台是否作为下级（向上级平台注册）
# 默认: false
enable_lower = false

# 上级平台 SIP 地址（enable_lower = true 时必填）
# 默认: null
# upper_platform_sip = "sip:192.168.1.1:5060"

# 上级平台 ID
# 默认: null
# upper_platform_id = "34020000002000000001"

# 向上级注册的密码
# 默认: null
# upper_auth_password = "12345678"

# 上级平台协议版本（决定出网目录 XML 字符集：v2016→GB2312，v2022→GB18030）
# 默认: v2022
upper_version = "v2022"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║ 11. tx_di_gb_dev — GB28181 设备端（UAC，向上级注册）
# ║ TOML key: [gb_dev]     init_sort: 30000
# ║ 依赖: tx_di_sip
# ╚══════════════════════════════════════════════════════════════════════════════
[gb_dev]
# 上级平台地址（完整 SIP URI）
# 格式: "sip:platform_id@host:port"
# 默认: ""
# platform_uri = "sip:34020000002000000001@192.168.1.1:5060"

# 本设备 ID（注册用户名，通常为 20 位编码）
# 默认: ""
# device_id = "34020000001320000001"

# 注册用户名（一般等于 device_id）
# 默认: ""
# username = "34020000001320000001"

# 注册密码
# 默认: ""
# password = "12345678"

# 认证域（realm）。null 表示接受任意挑战
# 默认: null
# realm = "3402000000"

# 注册有效期（秒）
# 默认: 3600
register_ttl = 3600

# 心跳间隔（秒）
# 默认: 60
heartbeat_secs = 60

# 协议版本。可选: v2016 / v2022
# 默认: v2022
version = "v2022"

# 是否启用设备端
# 默认: false
enabled = false
