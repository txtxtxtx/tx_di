syntax = "proto3";

package admin.dict;

import "common.proto";

// ============================================================
// 字典服务
// ============================================================

service DictService {
  // ---- 字典类型 CRUD ----
  /// 新增字典类型
  rpc CreateDictType(CreateDictTypeRequest) returns (DictTypeResponse);
  /// 更新字典类型
  rpc UpdateDictType(UpdateDictTypeRequest) returns (DictTypeResponse);
  /// 删除字典类型（级联删除其下所有字典数据）
  rpc DeleteDictType(DeleteDictTypeRequest) returns (admin.common.Empty);
  /// 按 ID 查询字典类型
  rpc GetDictType(GetDictTypeRequest) returns (DictTypeResponse);
  /// 分页查询字典类型列表
  rpc ListDictTypes(ListDictTypesRequest) returns (ListDictTypesResponse);

  // ---- 字典数据 CRUD ----
  /// 新增字典数据项
  rpc CreateDictData(CreateDictDataRequest) returns (DictDataResponse);
  /// 更新字典数据项
  rpc UpdateDictData(UpdateDictDataRequest) returns (DictDataResponse);
  /// 删除字典数据项
  rpc DeleteDictData(DeleteDictDataRequest) returns (admin.common.Empty);
  /// 按 ID 查询字典数据项
  rpc GetDictData(GetDictDataRequest) returns (DictDataResponse);
  /// 分页查询字典数据项
  rpc ListDictData(ListDictDataRequest) returns (ListDictDataResponse);

  // 批量查询
  /// 按多个字典类型批量查询全部字典数据（前端下拉框常用）
  rpc GetByDictTypes(GetByDictTypesRequest) returns (GetByDictTypesResponse);
}

// ---- 字典类型 ----

// 新增字典类型请求
message CreateDictTypeRequest {
  string name = 1;          // 字典类型显示名称
  string dict_type = 2;     // 字典类型标识（全局唯一，如 "sys_yes_no"）
  optional string remark = 3; // 备注说明
}

// 更新字典类型请求
message UpdateDictTypeRequest {
  uint64 id = 1;            // 字典类型 ID
  string name = 2;          // 字典类型显示名称
  string dict_type = 3;     // 字典类型标识
  optional string remark = 4; // 备注说明
}

// 删除字典类型请求
message DeleteDictTypeRequest {
  uint64 id = 1;  // 字典类型 ID
}

// 按 ID 查询字典类型请求
message GetDictTypeRequest {
  uint64 id = 1;  // 字典类型 ID
}

// 分页查询字典类型请求
message ListDictTypesRequest {
  optional string name = 1;       // 按名称模糊过滤
  optional string dict_type = 2;  // 按类型标识模糊过滤
  optional int32 status = 3;      // 按状态过滤：0=停用, 1=正常
  int64 page = 4;                 // 页码
  int64 page_size = 5;            // 每页条数
}

// 字典类型响应
message DictTypeResponse {
  uint64 id = 1;            // 字典类型 ID
  string name = 2;          // 字典类型显示名称
  string dict_type = 3;     // 字典类型标识
  int32 status = 4;         // 状态：0=停用, 1=正常
  optional string remark = 5; // 备注说明
}

// 分页查询字典类型响应
message ListDictTypesResponse {
  repeated DictTypeResponse items = 1;  // 字典类型列表
  admin.common.PageResponse page_info = 2; // 分页信息
}

// ---- 字典数据 ----

// 新增字典数据请求
message CreateDictDataRequest {
  int32 sort = 1;               // 排序号（越小越靠前）
  string label = 2;             // 展示文本（如 "是"）
  string value = 3;             // 存储值（如 "1"）
  string dict_type = 4;         // 所属字典类型标识
  optional string color_type = 5; // 标签颜色（如 "success"/"warning"/"danger"）
  optional string css_class = 6;  // 自定义 CSS 类名
  optional string remark = 7;   // 备注说明
}

// 更新字典数据请求
message UpdateDictDataRequest {
  uint64 id = 1;                // 字典数据 ID
  int32 sort = 2;               // 排序号
  string label = 3;             // 展示文本
  string value = 4;             // 存储值
  string dict_type = 5;         // 所属字典类型标识
  optional string color_type = 6; // 标签颜色
  optional string css_class = 7;  // 自定义 CSS 类名
  optional string remark = 8;   // 备注说明
}

// 删除字典数据请求
message DeleteDictDataRequest {
  uint64 id = 1;  // 字典数据 ID
}

// 按 ID 查询字典数据请求
message GetDictDataRequest {
  uint64 id = 1;  // 字典数据 ID
}

// 分页查询字典数据请求
message ListDictDataRequest {
  optional string dict_type = 1; // 按字典类型精确过滤
  optional string label = 2;     // 按展示文本模糊过滤
  optional int32 status = 3;     // 按状态过滤：0=停用, 1=正常
  int64 page = 4;                // 页码
  int64 page_size = 5;           // 每页条数
}

// 字典数据响应
message DictDataResponse {
  uint64 id = 1;                // 字典数据 ID
  int32 sort = 2;               // 排序号
  string label = 3;             // 展示文本
  string value = 4;             // 存储值
  string dict_type = 5;         // 所属字典类型标识
  int32 status = 6;             // 状态：0=停用, 1=正常
  optional string color_type = 7; // 标签颜色
  optional string css_class = 8;  // 自定义 CSS 类名
  optional string remark = 9;   // 备注说明
}

// 分页查询字典数据响应
message ListDictDataResponse {
  repeated DictDataResponse items = 1;  // 字典数据列表
  admin.common.PageResponse page_info = 2; // 分页信息
}

// 按多个字典类型批量查询请求
message GetByDictTypesRequest {
  repeated string dict_types = 1;  // 字典类型标识列表
}

// 按多个字典类型批量查询响应
message GetByDictTypesResponse {
  map<string, ListDictDataResponse> dict_data = 1;  // 字典类型标识 → 该类型下的数据列表
}
