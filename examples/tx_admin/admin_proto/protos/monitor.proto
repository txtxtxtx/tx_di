syntax = "proto3";

package admin.monitor;

import "google/protobuf/empty.proto";

// 磁盘信息
message DiskInfo {
  string name = 1;            // 磁盘名称/挂载点
  uint64 total_space = 2;     // 总空间（字节）
  uint64 available_space = 3; // 可用空间（字节）
  double usage = 4;           // 使用率（百分比，0~100）
}

// 网络接口信息
message NetworkInfo {
  string name = 1;                     // 接口名称（如 eth0）
  string mac_address = 2;              // MAC 地址
  repeated string ip_addresses = 3;    // IP 地址列表（含 IPv4/IPv6）
  uint64 received_bytes = 4;           // 累计收到字节数
  uint64 transmitted_bytes = 5;        // 累计发送字节数
  uint64 received_packets = 6;         // 累计收到包数
  uint64 transmitted_packets = 7;      // 累计发送包数
}

// 服务器整体信息
message ServerInfo {
  string os_name = 1;       // 操作系统名称（如 "Linux"、"Windows"）
  string os_version = 2;    // 操作系统版本
  string hostname = 3;      // 主机名
  uint32 cpu_cores = 4;     // CPU 核心数
  double cpu_usage = 5;     // CPU 使用率（百分比）
  uint64 total_memory = 6;  // 总内存（字节）
  uint64 used_memory = 7;   // 已用内存（字节）
  double memory_usage = 8;  // 内存使用率（百分比）
  uint64 total_disk = 9;    // 磁盘总空间（字节）
  uint64 used_disk = 10;    // 磁盘已用空间（字节）
  double disk_usage = 11;   // 磁盘使用率（百分比）
  repeated DiskInfo disks = 12;    // 各磁盘详情
  repeated NetworkInfo networks = 13; // 各网络接口详情
}

// 在线用户信息
message OnlineUser {
  uint64 user_id = 1;    // 用户 ID
  string username = 2;   // 用户名
  string login_ip = 3;   // 登录 IP
  string login_time = 4; // 登录时间（ISO8601 字符串）
}

// 在线用户列表响应
message OnlineUserListResponse {
  repeated OnlineUser users = 1;  // 在线用户列表
  uint64 total = 2;               // 在线用户总数
}

service MonitorService {
  /// 获取服务器运行状态（CPU/内存/磁盘/网络）
  rpc GetServerInfo(google.protobuf.Empty) returns (ServerInfo);
  /// 获取当前在线用户列表
  rpc GetOnlineUsers(google.protobuf.Empty) returns (OnlineUserListResponse);
}
