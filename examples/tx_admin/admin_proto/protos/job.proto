syntax = "proto3";

package admin.job;

import "common.proto";

// ============================================================
// 定时任务服务
// ============================================================

service JobService {
  /// 新增定时任务
  rpc CreateJob(CreateJobRequest) returns (JobResponse);
  /// 更新定时任务
  rpc UpdateJob(UpdateJobRequest) returns (JobResponse);
  /// 删除定时任务
  rpc DeleteJob(DeleteJobRequest) returns (admin.common.Empty);
  /// 按 ID 查询定时任务
  rpc GetJob(GetJobRequest) returns (JobResponse);
  /// 分页查询定时任务
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  /// 暂停/恢复任务
  rpc ChangeJobStatus(ChangeJobStatusRequest) returns (JobResponse);
  /// 立即执行一次任务
  rpc RunJob(RunJobRequest) returns (admin.common.Empty);
}

service JobLogService {
  /// 分页查询任务执行日志
  rpc ListJobLogs(ListJobLogsRequest) returns (ListJobLogsResponse);
  /// 按 ID 查询任务日志详情
  rpc GetJobLog(GetJobLogRequest) returns (JobLogResponse);
  /// 清理任务日志（按任务或全部）
  rpc CleanJobLogs(CleanJobLogsRequest) returns (admin.common.Empty);
}

// ============================================================
// Job Messages
// ============================================================

// 定时任务信息
message JobResponse {
  uint64 id = 1;                    // 任务 ID
  string name = 2;                  // 任务名称
  int32 status = 3;                 // 状态：0=暂停, 1=运行
  string handler_name = 4;          // 执行器名称（内部函数/脚本标识）
  optional string handler_param = 5; // 执行器参数（JSON 字符串）
  string cron_expression = 6;       // Cron 表达式（6 段，秒级）
  int32 retry_count = 7;            // 失败重试次数
  int32 retry_interval = 8;         // 重试间隔（秒）
  int32 monitor_timeout = 9;        // 单次执行超时时间（秒）
}

// 新增定时任务请求
message CreateJobRequest {
  string name = 1;                  // 任务名称
  string handler_name = 2;          // 执行器名称
  optional string handler_param = 3; // 执行器参数
  string cron_expression = 4;       // Cron 表达式
  int32 retry_count = 5;            // 失败重试次数
  int32 retry_interval = 6;         // 重试间隔（秒）
  int32 monitor_timeout = 7;        // 执行超时（秒）
}

// 更新定时任务请求
message UpdateJobRequest {
  uint64 id = 1;                    // 任务 ID
  string name = 2;                  // 任务名称
  string handler_name = 3;          // 执行器名称
  optional string handler_param = 4; // 执行器参数
  string cron_expression = 5;       // Cron 表达式
  int32 retry_count = 6;            // 失败重试次数
  int32 retry_interval = 7;         // 重试间隔（秒）
  int32 monitor_timeout = 8;        // 执行超时（秒）
}

// 删除定时任务请求
message DeleteJobRequest {
  uint64 id = 1;  // 任务 ID
}

// 按 ID 查询定时任务请求
message GetJobRequest {
  uint64 id = 1;  // 任务 ID
}

// 分页查询定时任务请求
message ListJobsRequest {
  optional string name = 1;   // 按任务名称模糊过滤
  optional int32 status = 2;  // 按状态过滤：0=暂停, 1=运行
  int64 page = 3;             // 页码
  int64 page_size = 4;        // 每页条数
}

// 分页查询定时任务响应
message ListJobsResponse {
  repeated JobResponse items = 1;  // 任务列表
  admin.common.PageResponse page_info = 2; // 分页信息
}

// 修改任务状态请求
message ChangeJobStatusRequest {
  uint64 id = 1;      // 任务 ID
  int32 status = 2;   // 目标状态：0=暂停, 1=运行
}

// 立即执行任务请求
message RunJobRequest {
  uint64 id = 1;  // 任务 ID
}

// ============================================================
// JobLog Messages
// ============================================================

// 任务执行日志
message JobLogResponse {
  uint64 id = 1;                    // 日志 ID
  uint64 job_id = 2;                // 所属任务 ID
  string handler_name = 3;          // 执行器名称
  optional string handler_param = 4; // 执行器参数
  int32 execute_index = 5;          // 执行序号（重试次数计数）
  string begin_time = 6;            // 开始时间（ISO8601 字符串）
  optional string end_time = 7;     // 结束时间
  optional int32 duration = 8;      // 执行耗时（毫秒）
  int32 status = 9;                 // 状态：0=执行中, 1=成功, 2=失败
  optional string result = 10;      // 执行结果/输出
}

// 分页查询任务日志请求
message ListJobLogsRequest {
  optional uint64 job_id = 1;  // 按任务过滤
  optional int32 status = 2;   // 按状态过滤：0=执行中, 1=成功, 2=失败
  int64 page = 3;              // 页码
  int64 page_size = 4;         // 每页条数
}

// 分页查询任务日志响应
message ListJobLogsResponse {
  repeated JobLogResponse items = 1;  // 日志列表
  admin.common.PageResponse page_info = 2; // 分页信息
}

// 按 ID 查询任务日志请求
message GetJobLogRequest {
  uint64 id = 1;  // 日志 ID
}

// 清理任务日志请求
message CleanJobLogsRequest {
  optional uint64 job_id = 1; // 为空则清空所有任务日志
}
