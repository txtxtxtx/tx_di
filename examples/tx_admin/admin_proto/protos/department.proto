syntax = "proto3";

package admin.dept;

import "common.proto";

// ============================================================
// 部门服务
// ============================================================

service DepartmentService {
  /// 新增部门
  rpc CreateDept(CreateDeptRequest) returns (DeptResponse);
  /// 更新部门信息
  rpc UpdateDept(UpdateDeptRequest) returns (DeptResponse);
  /// 删除部门
  rpc DeleteDept(DeleteDeptRequest) returns (admin.common.Empty);
  /// 按 ID 查询部门
  rpc GetDept(GetDeptRequest) returns (DeptResponse);
  /// 查询部门列表（支持名称/状态过滤）
  rpc ListDepts(ListDeptsRequest) returns (ListDeptsResponse);
}

// 新增部门请求
message CreateDeptRequest {
  string name = 1;              // 部门名称
  uint64 parent_id = 2;         // 上级部门 ID，0 表示顶级部门
  int32 sort = 3;               // 排序号（越小越靠前）
  optional uint64 leader_user_id = 4; // 负责人用户 ID
  optional string phone = 5;    // 联系电话
  optional string email = 6;    // 联系邮箱
}

// 更新部门请求
message UpdateDeptRequest {
  uint64 dept_id = 1;           // 部门 ID
  string name = 2;              // 部门名称
  uint64 parent_id = 3;         // 上级部门 ID
  int32 sort = 4;               // 排序号
  optional uint64 leader_user_id = 5; // 负责人用户 ID
  optional string phone = 6;    // 联系电话
  optional string email = 7;    // 联系邮箱
}

// 删除部门请求
message DeleteDeptRequest {
  uint64 dept_id = 1;  // 部门 ID
}

// 按 ID 查询部门请求
message GetDeptRequest {
  uint64 dept_id = 1;  // 部门 ID
}

// 查询部门列表请求
message ListDeptsRequest {
  optional string name = 1;   // 按名称模糊过滤
  optional int32 status = 2;  // 按状态过滤：0=停用, 1=正常
}

// 部门信息响应
message DeptResponse {
  uint64 id = 1;                // 部门 ID
  string name = 2;              // 部门名称
  uint64 parent_id = 3;         // 上级部门 ID
  int32 sort = 4;               // 排序号
  optional uint64 leader_user_id = 5; // 负责人用户 ID
  optional string phone = 6;    // 联系电话
  optional string email = 7;    // 联系邮箱
  int32 status = 8;             // 状态：0=停用, 1=正常
}

// 查询部门列表响应
message ListDeptsResponse {
  repeated DeptResponse items = 1;  // 部门列表
}
