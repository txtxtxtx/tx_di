        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OnlineUserListResponse'
  /api/v1/job/list:
    post:
      tags: [Job]
