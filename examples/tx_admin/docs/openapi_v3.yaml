openapi: 3.0.3
info:
  title: TX Admin API
  version: 1.0.0
  description: |
    管理后台 HTTP API（tx_admin）OpenAPI 3 规范。

    全局约定：
    - 业务路由统一前缀 /api/v1，健康检查 /health 无前缀。
    - 统一响应包装 ApiR<T> = { code, msg, data }，HTTP 状态码恒为 200。
    - 认证基于 sa-token：登录成功后令牌写入 HttpOnly Cookie（默认键名 satoken，
      实际键名由 SaTokenConf.token_name 决定），请求需携带该 Cookie。
servers:
  - url: http://localhost:8080
    description: 本地开发环境
security:
  - saToken: []
tags:
  - name: Auth
    description: 认证与当前用户信息
  - name: User
    description: 用户管理
  - name: Role
    description: 角色管理
  - name: Menu
    description: 菜单管理
  - name: Dept
    description: 部门管理
  - name: Config
    description: 系统配置
  - name: Dict
    description: 数据字典
  - name: Log
    description: 操作/登录日志
  - name: File
    description: 文件存储
  - name: Monitor
    description: 服务监控
  - name: Job
    description: 定时任务
  - name: Tool
    description: 开发工具
  - name: Health
    description: 健康检查
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      description: 校验用户名/密码，返回令牌与用户基础信息；令牌写入 HttpOnly Cookie。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
  /api/v1/auth/user_info:
    get:
      tags: [Auth]
      summary: 获取当前用户详细信息（含角色、权限）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfoResponse'
  /api/v1/auth/menus:
    get:
      tags: [Auth]
      summary: 获取当前用户菜单树
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuTreeNode'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 用户登出
      description: 销毁 sa-token 会话并清除 HttpOnly Cookie。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Empty'
  /api/v1/user/:
    post:
      tags: [User]
      summary: 新增用户
      description: 所需权限 user:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
  /api/v1/user/{user_id}:
    get:
      tags: [User]
      summary: 按 ID 查询用户
      description: 所需权限 user:view
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 用户 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
    put:
      tags: [User]
      summary: 部分更新用户信息
      description: 所需权限 user:update（修改本人信息除外）
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [User]
      summary: 删除用户
      description: 所需权限 user:delete
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 用户 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Empty'
  /api/v1/user/list:
    post:
      tags: [User]
