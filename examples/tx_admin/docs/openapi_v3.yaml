                        type: array
                        items:
                          $ref: '#/components/schemas/UserResponse'
    post:
      tags: [Role]
      summary: 向角色添加用户
      description: 所需权限 role:assign_menu
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 角色 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
