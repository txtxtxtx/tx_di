      description: 所需权限 job:view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 任务 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobResponse'
    put:
      tags: [Job]
      summary: 更新定时任务
      description: 所需权限 job:update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 任务 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobResponse'
    delete:
      tags: [Job]
      summary: 删除定时任务
      description: 所需权限 job:delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 任务 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Empty'
  /api/v1/job/:
    post:
      tags: [Job]
      summary: 新增定时任务
      description: 所需权限 job:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobResponse'
  /api/v1/job/{id}/status:
    put:
      tags: [Job]
      summary: 暂停/恢复定时任务
      description: 所需权限 job:status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 任务 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeJobStatusRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobResponse'
  /api/v1/job/{id}/run:
    post:
      tags: [Job]
      summary: 手动立即执行一次任务
      description: 所需权限 job:execute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 任务 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Empty'
  /api/v1/job/log/list:
    post:
      tags: [Job]
      summary: 分页查询任务执行日志
      description: 所需权限 job:view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListJobLogsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageJobLog'
  /api/v1/job/log/{id}:
    get:
      tags: [Job]
      summary: 按 ID 查询任务执行日志详情
      description: 所需权限 job:view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 日志 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JobLogResponse'
    delete:
      tags: [Job]
      summary: 清空任务执行日志
      description: 所需权限 job:delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanJobLogsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Empty'
  /api/v1/tool/cache/stats:
    get:
      tags: [Tool]
      summary: 获取缓存统计
      description: 所需权限 system:view；当前为示例 mock 数据，待接入真实缓存组件
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiR'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CacheStatsResponse'
  /health:
    get:
      tags: [Health]
      summary: 综合健康信息
      description: "公开路由（无需认证）；返回 {status, db, version} 等裸 JSON（非 ApiR 包装）"
      security: []
      responses:
        '200':
          description: 综合健康信息（status=ok/degraded）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/live:
    get:
      tags: [Health]
      summary: 存活探针
      description: 公开路由（无需认证）；进程存活即返回 200
      security: []
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: alive}
  /health/ready:
    get:
      tags: [Health]
      summary: 就绪探针
      description: 公开路由（无需认证）；校验数据库连通，异常返回 503
      security: []
      responses:
        '200':
          description: 就绪（数据库正常）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ready}
                  db: {type: string, example: ok}
        '503':
          description: 未就绪（数据库异常）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: unavailable}
                  db: {type: string, example: error}
components:
  securitySchemes:
    saToken:
      type: apiKey
      in: cookie
      name: satoken
      description: sa-token 会话令牌（HttpOnly Cookie）
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 登录用户名
        password:
          type: string
          description: 登录密码（明文，传输层使用 HTTPS）
        login_ip:
          type: string
          description: 登录来源 IP（用于日志审计）
    LoginResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: 用户 ID
        username:
          type: string
        nickname:
          type: string
          description: 昵称/显示名
        tenant_id:
          type: integer
          format: int64
          description: 租户 ID
        role_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 角色 ID 列表
        permissions:
          type: array
          items:
            type: string
          description: 权限标识列表，如 system:user:add
        dept_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 所属部门 ID 列表
        token:
          type: string
          description: 登录令牌
        role_codes:
          type: array
          items:
            type: string
          description: 角色编码列表，如 admin
    UserInfoResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
          nullable: true
          description: 邮箱
        mobile:
          type: string
          nullable: true
          description: 手机号
        avatar:
          type: string
          nullable: true
          description: 头像 URL
        roles:
          type: array
          items:
            type: string
          description: 角色名称列表
        permissions:
          type: array
          items:
            type: string
          description: 权限标识列表
        tenant_id:
          type: integer
          format: int64
    LogoutRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: 用户 ID

    CreateUserRequest:
      type: object
      required: [username, password, nickname]
      properties:
        username:
          type: string
          description: 登录用户名（全局唯一）
        password:
          type: string
          description: 初始密码
        nickname:
          type: string
          description: 昵称/显示名
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        sex:
          type: integer
          format: int32
          nullable: true
          description: 性别 0-未知 1-男 2-女
        remark:
          type: string
          nullable: true
        role_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 初始角色 ID 列表
        dept_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 初始部门 ID 列表
    UpdateUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
          format: int64
        nickname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        sex:
          type: integer
          format: int32
          nullable: true
        remark:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
          description: 状态 0-正常 1-禁用 2-锁定
    ChangeUserStatusRequest:
      type: object
      required: [user_id, status]
      properties:
        user_id:
          type: integer
          format: int64
        status:
          type: integer
          format: int32
          description: 目标状态 0-正常 1-禁用 2-锁定
    ChangePasswordRequest:
      type: object
      required: [user_id, new_password]
      properties:
        user_id:
          type: integer
          format: int64
        new_password:
          type: string
          description: 新密码（明文）
    AssignRolesRequest:
      type: object
      required: [user_id, role_ids]
      properties:
        user_id:
          type: integer
          format: int64
        role_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 角色 ID 列表（全量覆盖）
    AssignDeptsRequest:
      type: object
      required: [user_id, dept_ids]
      properties:
        user_id:
          type: integer
          format: int64
        dept_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 部门 ID 列表（全量覆盖）
    ListUsersRequest:
      type: object
      properties:
        username:
          type: string
          nullable: true
          description: 按用户名模糊过滤
        nickname:
          type: string
          nullable: true
          description: 按昵称模糊过滤
        mobile:
          type: string
          nullable: true
          description: 按手机号模糊过滤
        status:
          type: integer
          format: int32
          nullable: true
          description: 按状态过滤 0-正常 1-禁用 2-锁定
        dept_id:
          type: integer
          format: int64
          nullable: true
          description: 按部门过滤
        page_info:
          $ref: '#/components/schemas/PageRequest'
    UserIdRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
          format: int64
          description: 用户 ID
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        sex:
          type: integer
          format: int32
          description: 性别 0-未知 1-男 2-女
        status:
          type: integer
          format: int32
          description: 状态 0-正常 1-禁用 2-锁定
        remark:
          type: string
          nullable: true
        role_ids:
          type: array
          items:
            type: integer
            format: int64
        dept_ids:
          type: array
          items:
            type: integer
            format: int64
        avatar:
          type: string
          nullable: true
        login_ip:
          type: string
          nullable: true
        login_date:
          type: integer
          format: int64
          description: 最近登录时间（Unix 毫秒），0 表示未登录
        tenant_id:
          type: integer
          format: int64
        create_time:
          type: integer
          format: int64
          description: 创建时间（Unix 毫秒）
        update_time:
          type: integer
          format: int64
          description: 更新时间（Unix 毫秒）
    PageUser:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/UserResponse'

    CreateRoleRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          description: 角色名称
        code:
          type: string
          description: 角色编码（全局唯一，如 admin）
        sort:
          type: integer
          format: int32
          description: 排序号（越小越靠前）
        remark:
          type: string
          nullable: true
        menu_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 初始分配的菜单 ID 列表
    UpdateRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
        sort:
          type: integer
          format: int32
        data_scope:
          type: integer
          format: int32
          description: 数据权限范围 0-全部 1-本部门 2-本部门及以下 3-仅本人
        remark:
          type: string
          nullable: true
    AssignMenusRequest:
      type: object
      required: [role_id, menu_ids]
      properties:
        role_id:
          type: integer
          format: int64
        menu_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 分配的菜单 ID 列表（全量覆盖）
    RoleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
        sort:
          type: integer
          format: int32
        data_scope:
          type: integer
          format: int32
          description: 数据权限范围
        status:
          type: integer
          format: int32
          description: 状态 0-停用 1-正常
        remark:
          type: string
          nullable: true
        menu_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 已分配的菜单 ID 列表
    ListRolesRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: 按名称模糊过滤
        code:
          type: string
          nullable: true
          description: 按编码模糊过滤
        status:
          type: integer
          format: int32
          nullable: true
          description: 按状态过滤 0-停用 1-正常
        page:
          type: integer
          format: int64
          description: 页码
        page_size:
          type: integer
          format: int64
          description: 每页条数
    PageRole:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/RoleResponse'

    CreateMenuRequest:
      type: object
      required: [name, permission, types]
      properties:
        name: {type: string, description: 菜单名称}
        permission: {type: string, description: 权限标识，如 system:user:list}
        types: {type: integer, format: int32, description: 菜单类型 0-目录 1-菜单 2-按钮}
        sort: {type: integer, format: int32, description: 排序号}
        parent_id: {type: integer, format: int64, description: 上级菜单 ID，0 表示顶级}
        path: {type: string, nullable: true, description: 路由路径}
        icon: {type: string, nullable: true, description: 图标名称}
        component: {type: string, nullable: true, description: 前端组件路径}
        component_name: {type: string, nullable: true, description: 组件名称}
    UpdateMenuRequest:
      type: object
      required: [menu_id]
      properties:
        menu_id: {type: integer, format: int64}
        name: {type: string}
        permission: {type: string}
        types: {type: integer, format: int32}
        sort: {type: integer, format: int32}
        parent_id: {type: integer, format: int64}
        path: {type: string, nullable: true}
        icon: {type: string, nullable: true}
        component: {type: string, nullable: true}
        component_name: {type: string, nullable: true}
        visible: {type: integer, format: int32, description: 是否显示 0-隐藏 1-显示}
        keep_alive: {type: integer, format: int32, description: 是否缓存 0-否 1-是}
    MenuResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        permission: {type: string}
        types: {type: integer, format: int32, description: 菜单类型 0-目录 1-菜单 2-按钮}
        sort: {type: integer, format: int32}
        parent_id: {type: integer, format: int64}
        path: {type: string, nullable: true}
        icon: {type: string, nullable: true}
        component: {type: string, nullable: true}
        component_name: {type: string, nullable: true}
        status: {type: integer, format: int32, description: 状态 0-停用 1-正常}
        visible: {type: integer, format: int32}
        keep_alive: {type: integer, format: int32}
    MenuTreeNode:
      type: object
      description: 菜单树节点（children 递归）
      properties:
        id: {type: string, description: 菜单节点 ID（字符串形式）}
        name: {type: string}
        permission: {type: string}
        types: {type: integer, format: int32}
        sort: {type: integer, format: int32}
        parentId: {type: string, description: 父级菜单 ID}
        path: {type: string, nullable: true}
        icon: {type: string, nullable: true}
        component: {type: string, nullable: true}
        componentName: {type: string, nullable: true}
        status: {type: integer, format: int32}
        visible: {type: integer, format: int32}
        keepAlive: {type: integer, format: int32}
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuTreeNode'
    ListMenusRequest:
      type: object
      properties:
        name: {type: string, nullable: true, description: 按名称模糊过滤}
        status: {type: integer, format: int32, nullable: true, description: 按状态过滤 0-停用 1-正常}
        types: {type: integer, format: int32, nullable: true, description: 按类型过滤 0-目录 1-菜单 2-按钮}

    CreateDeptRequest:
      type: object
      required: [name, parent_id]
      properties:
        name: {type: string, description: 部门名称}
        parent_id: {type: integer, format: int64, description: 上级部门 ID，0 表示顶级}
        sort: {type: integer, format: int32, description: 排序号}
        leader_user_id: {type: integer, format: int64, nullable: true, description: 负责人用户 ID}
        phone: {type: string, nullable: true, description: 联系电话}
        email: {type: string, nullable: true, description: 联系邮箱}
    UpdateDeptRequest:
      type: object
      required: [dept_id]
      properties:
        dept_id: {type: integer, format: int64}
        name: {type: string}
        parent_id: {type: integer, format: int64}
        sort: {type: integer, format: int32}
        leader_user_id: {type: integer, format: int64, nullable: true}
        phone: {type: string, nullable: true}
        email: {type: string, nullable: true}
    DeptResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        parent_id: {type: integer, format: int64}
        sort: {type: integer, format: int32}
        leader_user_id: {type: integer, format: int64, nullable: true}
        phone: {type: string, nullable: true}
        email: {type: string, nullable: true}
        status: {type: integer, format: int32, description: 状态 0-停用 1-正常}
