[file_config]
backend = "local"
base_path = "./uploads"
base_url = "http://localhost:8080/files"
max_file_size = 10485760

[file_config.s3]
access_key = ""
bucket = ""
endpoint = ""
force_path_style = false
region = "ap-southeast-1"
secret_key = ""

[log_config]
console_output = true
dir = "./logs"
# level = "debug"
prefix = "tx_admin"
retention_days = 7
time_format = "local"
# 阶段 E-3：OpenTelemetry 链路导出（OTLP HTTP，对接 Jaeger/OTel Collector）。
# 配置后自动启用；为空则不启用。示例：otlp_endpoint = "http://127.0.0.1:4318"
# otlp_endpoint = ""
# service_name = "tx-admin"

[sa_token]
# Redis 连接串（会话跨实例共享，水平扩容必需；本地无 Redis 时注释掉并改用内存 feature）
# redis_url = "redis://127.0.0.1:6379/0"
active_timeout = 1800
auto_renew = true
enable_refresh_token = true
is_concurrent = true
is_read_cookie = false
is_read_header = true
is_share = true
refresh_token_timeout = 604800
timeout = 86400
token_name = "Authorization"
token_style = "simple-uuid"

[toasty_config]
auto_schema = false
# 生产迁移模式：受控 push_schema（diff 增量）+ 版本审计表 _schema_migrations
migrate_on_start = true
database_url = "sqlite:examples/tx_admin/data/tx_admin.db"
max_pool_size = 10

# 注册中心（Nacos）：enabled=true 时注册 HTTP/gRPC 端点并支持配置中心
# 生产多实例部署开启；本地无 Nacos 时保持 false
[registry_config]
enabled = true
nacos_addr = "http://192.168.0.91:8848"
namespace = "724add82-6b07-4bc6-aed5-b6d9425db423"
group = "DEFAULT_GROUP"
service_name = "tx_admin"
auto_register = true
username = "nacos"
password = "Yc@53672578."
# 主配置 data_id（默认 "{service_name}.toml"）：启动拉取 + 合并本地，变更时优雅重启生效
# config_data_id = "tx-admin.toml"

[job_config]
enabled = true
poll_interval_secs = 1
shell_timeout_secs = 300
python_timeout_secs = 300
python_path = "/usr/bin/python3"
thread_pool_size = 4

# gRPC 服务监听端口（可被环境变量 GRPC_PORT 覆盖）
[grpc_config]
port = 50051

[web_config]
enable_cors = true
host = "::"
layers = [[5, "timeout"], [10, "api_log"], [100, "compression"], [10000, "cors"]]
max_body_size = 104857600
port = 8888
timeout_secs = 30

[web_config.spa_apps]
"/web" = "examples/tx_admin/web/dist"