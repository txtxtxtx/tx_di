[package]
name = "tx_di_sa_token"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[features]
# 无默认 feature：内存存储始终可用（sa-token-storage-memory 直接依赖）
default = []

# Redis 存储（可选增强，适用于生产环境/水平扩容场景）
# 未启用时回退内存存储；启用后仍可配置使用内存（见 config.rs create_storage）
redis = ["sa-token-plugin-axum/redis"]

[dependencies]
tx-di-core = { path = "../../tx-di-core" }
tx_di_axum = { path = "../tx_di_axum" }
sa-token-plugin-axum = { workspace = true, features = ["axum-08"] }
sa-token-storage-memory = { version = "0.1.18", default-features = false }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
